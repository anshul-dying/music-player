name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Quality Gate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup local environment file for testing
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env.local
          else
            touch .env.local
          fi

      - name: Enforce 300-line limits
        run: pnpm check:lines

      - name: Type check workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Run test suite
        run: pnpm test

      - name: Build companion extension package
        run: pnpm package:ext

      - name: Build packages and Next.js
        run: pnpm build
